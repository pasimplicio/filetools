<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Suite de Midia web baseada nas funcoes do sistema origem.">
    <title>FileTools | Suite de Midia</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css?v=4">
  </head>
  <body>
    <a class="skip-link" href="#workspace">Ir para a ferramenta</a>

    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#workspace" aria-label="Suite de Midia">
          <span class="brand-mark">FM</span>
          <span>
            <strong>FileTools</strong>
            <small>Suite de Midia</small>
          </span>
        </a>

        <nav class="tool-nav" id="toolNav" aria-label="Ferramentas"></nav>

        <button class="theme-button" id="themeToggle" type="button" aria-label="Alternar tema">
          <span aria-hidden="true">Tema</span>
          <strong id="themeLabel">Escuro</strong>
        </button>
      </aside>

      <main class="main-panel" id="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sistema origem: C:\midias_suite</p>
            <h1 id="viewTitle">Extrair Frames</h1>
          </div>
          <span class="status-badge" id="capabilityBadge">Executa no navegador</span>
        </header>

        <section class="workspace-grid">
          <article class="workbench">
            <div class="tool-heading">
              <div class="tool-icon" id="toolIcon" aria-hidden="true"></div>
              <div>
                <h2 id="toolName">Extrair Frames</h2>
                <p id="toolDescription"></p>
              </div>
            </div>

            <form class="tool-form" id="toolForm"></form>

            <div class="progress-wrap" id="progressWrap" hidden>
              <div class="progress-meta">
                <span id="progressLabel">Processando...</span>
                <span id="progressValue">0%</span>
              </div>
              <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
              </div>
            </div>

            <div class="result-box" id="resultBox" hidden></div>
          </article>

          <aside class="reference-panel">
            <section>
              <h2>Funcoes da origem</h2>
              <ul id="referenceList"></ul>
            </section>

            <section>
              <h2>Historico local</h2>
              <div class="history-list" id="historyList">
                <p class="muted">Nenhuma execucao registrada.</p>
              </div>
            </section>
          </aside>
        </section>
      </main>
    </div>

    <script defer src="app.js?v=4"></script>
  </body>
</html>
